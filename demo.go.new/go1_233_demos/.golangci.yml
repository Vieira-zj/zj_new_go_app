version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - copyloopvar
    - errorlint
    - nolintlint
    - gosec
    - goconst
    - misspell
    - revive
    - gocyclo
    - funlen
    - gocritic
    - durationcheck
    - wrapcheck
    - perfsprint
    - prealloc
    - testifylint

linters-settings:
  gocyclo:
    min-complexity: 15
  funlen:
    lines: 100
    statements: 60
  goconst:
    min-len: 3
    min-occurrences: 3
  misspell:
    locale: US
  revive:
    max-results: 20

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - funlen
        - wrapcheck
